# 本机物理内存只有 8GB。原先 -Xmx8g 直接导致 JVM 启动失败：
#   Native memory allocation (mmap) failed to map 1711276032 bytes. Error detail: G1 virtual space
# G1 除了堆还要预留一块虚拟空间（-Xmx 的 1/8 左右），8g 堆 + 预留必然撑爆。
# R8 处理 media/libraries 的 767MB 源码确实需要大堆，但必须留出系统余量：
#   -Xmx4600m 堆；SerialGC 无 G1 那种虚拟空间预留，峰值更省；
#   MaxMetaspaceSize 压到 768m；Kotlin daemon 关掉（另起 JVM 会吃掉 1GB+）；
#   workers=1 + parallel=false，避免多个 R8 进程同时抢内存。
# 若仍 OOM，可加 -XX:MaxMetaspaceSize=640m 并把 workers.max 保持 1。
org.gradle.jvmargs=-Xmx4600m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC -Dfile.encoding=UTF-8 --add-exports jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.daemon=true
org.gradle.caching=true
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true

# HTTP/HTTPS proxy 已关闭：aliyun / chaquo.com / jitpack / gradlePluginPortal / pypi 均可直连，
# 代理(127.0.0.1:51635)会导致 chaquo.com 502，故注释掉。
# systemProp.http.proxyHost=127.0.0.1
# systemProp.http.proxyPort=51635
# systemProp.https.proxyHost=127.0.0.1
# systemProp.https.proxyPort=51635
systemProp.http.nonProxyHosts=maven.aliyun.com|chaquo.com|pypi.org|files.pythonhosted.org|localhost|127.0.0.1
systemProp.https.nonProxyHosts=maven.aliyun.com|chaquo.com|pypi.org|files.pythonhosted.org|localhost|127.0.0.1