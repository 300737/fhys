name: Build APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      flavors:
        description: 'Which flavors to build'
        required: false
        default: 'leanback'
        type: choice
        options:
          - leanback
          - mobile
          - all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        # 手动触发时按输入选择；push/PR 只构建电视版，省 CI 时长
        include:
          - target: LeanbackArm64_v8a
            flavor: leanback
          - target: MobileArm64_v8a
            flavor: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Resolve which flavors to build
        id: pick
        run: |
          input="${{ github.event.inputs.flavors }}"
          flavor="${{ matrix.flavor }}"
          if [ -z "$input" ]; then
            # push / PR 自动触发：只构建电视版，避免 CI 跑太久
            [ "$flavor" = "leanback" ] && echo "run=true" >> "$GITHUB_OUTPUT" || echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ "$input" = "all" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$input" = "$flavor" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build ${{ matrix.target }} Release
        if: steps.pick.outputs.run == 'true'
        run: ./gradlew :app:assemble${{ matrix.target }}Release --no-daemon --stacktrace

      - name: Upload ${{ matrix.target }} APK
        if: steps.pick.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.flavor }}-arm64-v8a
          path: app/build/outputs/apk/**/*Release*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload mapping
        if: steps.pick.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ matrix.flavor }}
          path: app/build/outputs/mapping/**/mapping.txt
          if-no-files-found: ignore
          retention-days: 30
