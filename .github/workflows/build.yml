name: Build APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      flavors:
        description: 'Which flavors to build'
        required: false
        default: 'leanback'
        type: choice
        options:
          - leanback
          - mobile
          - all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: LeanbackArm64_v8a
            flavor: leanback
          - target: MobileArm64_v8a
            flavor: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # GitHub ubuntu-latest runner 预装了 Android SDK（ANDROID_HOME 已指向
      # /usr/local/lib/android/sdk），不要再用 setup-android 去 sdkmanager 装东西，
      # 否则会报 "Failed to find package 'tools'"。

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 签名密钥不入库。配置 Secret KEYSTORE_BASE64（base64 编码的 jks）后打 Release 包，
      # 未配置则退化为 Debug 包，保证流水线始终有产物。
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > tvbox-test.jks
            echo "has_key=true" >> "$GITHUB_ENV"
            echo "Signing key restored."
          else
            echo "has_key=false" >> "$GITHUB_ENV"
            echo "No KEYSTORE_BASE64 secret, will build Debug instead."
          fi

      - name: Resolve which flavors to build
        id: pick
        run: |
          input="${{ github.event.inputs.flavors }}"
          flavor="${{ matrix.flavor }}"
          if [ -z "$input" ]; then
            # push / PR 自动触发：只构建电视版，避免 CI 跑太久
            [ "$flavor" = "leanback" ] && echo "run=true" >> "$GITHUB_OUTPUT" || echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ "$input" = "all" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$input" = "$flavor" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build ${{ matrix.target }}
        if: steps.pick.outputs.run == 'true'
        run: |
          if [ "$has_key" = "true" ]; then
            ./gradlew :app:assemble${{ matrix.target }}Release --no-daemon --stacktrace
          else
            ./gradlew :app:assemble${{ matrix.target }}Debug --no-daemon --stacktrace
          fi

      - name: Upload ${{ matrix.target }} APK
        if: steps.pick.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.flavor }}-arm64-v8a
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 30
