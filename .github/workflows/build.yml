name: Build APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      flavors:
        description: 'Which flavors to build'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - leanback
          - mobile

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# publish job 要建 Release（rolling tag: latest）
permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        # 手机版 + 电视版 × v7a + v8a，四个包全出
        include:
          - target: LeanbackArm64_v8a
            flavor: leanback
            abi: arm64-v8a
          - target: LeanbackArmeabi_v7a
            flavor: leanback
            abi: armeabi-v7a
          - target: MobileArm64_v8a
            flavor: mobile
            abi: arm64-v8a
          - target: MobileArmeabi_v7a
            flavor: mobile
            abi: armeabi-v7a

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # chaquo（Python 源码源）需要 buildPython：CI 上用 setup-python 提供 3.10，
      # 与 chaquo/build.gradle 里 python version = "3.10" 对齐；
      # 本机的写死路径在 Linux 上不存在，build.gradle 已改为存在才启用。
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # GitHub ubuntu-latest runner 预装了 Android SDK，但预装的平台版本不含
      # android-37.0（新式 minor 命名）。不要用 android-actions/setup-android——
      # 它跑 sdkmanager --install tools 会报 "Failed to find package 'tools'"。
      - name: Install SDK platform 37.0
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(command -v sdkmanager)"
          echo "Using sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-37.0" "build-tools;37.0.0" 2>&1 | tail -5
          ls "$ANDROID_HOME/platforms"

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 签名密钥不入库，口令也不入库，四个 Secret 分工：
      #   KEYSTORE_BASE64        → tvbox-test.jks          （电视版 leanback 密钥库文件）
      #   MOBILE_KEYSTORE_BASE64 → tiantian_potian.keystore（手机版 mobile 密钥库文件）
      #   TV_STORE_PASSWORD      → tvbox-test.jks 的签名口令
      #   MOBILE_STORE_PASSWORD  → tiantian_potian.keystore 的签名口令
      # 只出正式版 Release 包；Secret 缺失时直接失败，不再退化为 Debug 测试包。
      - name: Restore signing keys
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          MOBILE_KEYSTORE_BASE64: ${{ secrets.MOBILE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > tvbox-test.jks
            echo "has_tv_key=true" >> "$GITHUB_ENV"
            echo "TV signing key restored."
          else
            echo "has_tv_key=false" >> "$GITHUB_ENV"
            echo "::error::KEYSTORE_BASE64 未配置，无法产出已签名的 Leanback Release 包"
          fi
          if [ -n "$MOBILE_KEYSTORE_BASE64" ]; then
            echo "$MOBILE_KEYSTORE_BASE64" | base64 -d > tiantian_potian.keystore
            echo "has_mobile_key=true" >> "$GITHUB_ENV"
            echo "Mobile signing key restored."
          else
            echo "has_mobile_key=false" >> "$GITHUB_ENV"
            echo "::error::MOBILE_KEYSTORE_BASE64 未配置，无法产出已签名的 Mobile Release 包"
          fi

      - name: Resolve which flavors to build
        id: pick
        run: |
          input="${{ github.event.inputs.flavors }}"
          flavor="${{ matrix.flavor }}"
          if [ -z "$input" ] || [ "$input" = "all" ]; then
            # push / PR 自动触发：手机版 + 电视版全构建
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$input" = "$flavor" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build ${{ matrix.target }}
        if: steps.pick.outputs.run == 'true'
        env:
          TV_STORE_PASSWORD: ${{ secrets.TV_STORE_PASSWORD }}
          MOBILE_STORE_PASSWORD: ${{ secrets.MOBILE_STORE_PASSWORD }}
        run: |
          if [ "${{ matrix.flavor }}" = "leanback" ]; then
            signed=$has_tv_key
            secret_name=KEYSTORE_BASE64
            pw="$TV_STORE_PASSWORD"
            pw_name=TV_STORE_PASSWORD
          else
            signed=$has_mobile_key
            secret_name=MOBILE_KEYSTORE_BASE64
            pw="$MOBILE_STORE_PASSWORD"
            pw_name=MOBILE_STORE_PASSWORD
          fi
          # 只出 Release；没有签名就不出包，避免混进 Debug 测试包
          if [ "$signed" != "true" ]; then
            echo "::error::缺少 $secret_name，${{ matrix.target }} 无法签名 Release 包"
            exit 1
          fi
          if [ -z "$pw" ]; then
            echo "::error::缺少签名口令 Secret $pw_name，${{ matrix.target }} 无法签名 Release 包"
            exit 1
          fi
          ./gradlew :app:assemble${{ matrix.target }}Release --no-daemon --stacktrace

      - name: Upload ${{ matrix.target }} APK
        if: steps.pick.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.flavor }}-${{ matrix.abi }}-release
          path: |
            app/build/outputs/apk/**/release/*.apk
            app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
      # 下载链接统一由末尾的 publish job 生成：Release 资产 + CF 反代直链，
      # 点开即下、无需 token。这里不再打印任何需要手拼的地址。

  # 全部包构建成功后，汇总发布到滚动 tag `latest` 的 Release。
  # 公开仓库的 release 资产免 token 即可下载，套 CF 反代就是点开即下的高速直链
  # （实测反代会连资产 302 一起收束到高速节点，不会漏回 Azure 裸连）。
  publish:
    name: Publish release
    needs: build
    if: ${{ needs.build.result == 'success' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve flavors
        id: pick
        run: |
          input="${{ github.event.inputs.flavors }}"
          if [ -z "$input" ] || [ "$input" = "all" ]; then
            echo "flavors=leanback,mobile" >> "$GITHUB_OUTPUT"
          else
            echo "flavors=$input" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect APKs
        run: |
          mkdir -p dist
          count=0
          for d in artifacts/apk-*; do
            [ -d "$d" ] || continue
            base=$(basename "$d")                    # apk-leanback-arm64-v8a-release
            key=${base#apk-}; key=${key%-release}     # leanback-arm64-v8a
            flavor=${key%%-*}
            case ",${{ steps.pick.outputs.flavors }}," in
              *",$flavor,"*) ;;
              *) echo "::error::非预期产物 $base（本次只构建 ${{ steps.pick.outputs.flavors }}）"; exit 1 ;;
            esac
            apk=$(find "$d" -name '*.apk' | head -1)
            if [ -z "$apk" ]; then
              echo "::error::$base 里没有 apk"; exit 1
            fi
            cp "$apk" "dist/fhys-$key.apk"
            count=$((count+1))
          done
          want=$(( $(echo "${{ steps.pick.outputs.flavors }}" | tr ',' '\n' | wc -l) * 2 ))
          if [ "$count" -ne "$want" ]; then
            echo "::error::预期 $want 个包，实际 $count 个"; exit 1
          fi
          ls -lh dist/

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: latest
          CF_PROXY: https://cf.612526.xyz
        run: |
          REPO="${{ github.repository }}"
          TITLE="最新构建 · run #${{ github.run_number }} · ${GITHUB_SHA::7}"
          DL="$CF_PROXY/${{ github.server_url }}/$REPO/releases/download/$TAG"
          NOTES="run #${{ github.run_number }} · commit ${GITHUB_SHA::7}

          $(for f in dist/*.apk; do n=$(basename "$f"); echo "- $n — $DL/$n"; done)"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --repo "$REPO" --clobber
            gh release edit "$TAG" --repo "$REPO" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" dist/*.apk --repo "$REPO" --title "$TITLE" --notes "$NOTES"
          fi
          # tag 挪到本次提交，保证 release 页面显示的 commit 与实际一致
          gh api --method PATCH "/repos/$REPO/git/refs/tags/$TAG" \
            -f sha="$GITHUB_SHA" -F force=true >/dev/null 2>&1 \
            || echo "tag 移动失败（不影响 assets 下载）"

      - name: Publish download links
        env:
          CF_PROXY: https://cf.612526.xyz
          TAG: latest
        run: |
          BASE="$CF_PROXY/${{ github.server_url }}/${{ github.repository }}/releases/download/$TAG"
          {
            echo "## 📦 下载（CF 高速直链 · 点开即下 · 无需 token）"
            echo ""
            for f in dist/*.apk; do
              n=$(basename "$f")
              echo "- **$n**（$(du -h "$f" | cut -f1)）→ [立即下载]($BASE/$n)"
            done
            echo ""
            echo "也可用仓库自带脚本自动等构建并下载：\`bash tools/fetch-apk.sh <flavor> <abi>\`"
            echo ""
            echo "构建记录：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
