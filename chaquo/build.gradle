plugins {
    id 'com.android.library'
    id 'com.chaquo.python'
}

android {
    namespace = 'com.fongmi.chaquo'

    compileSdk libs.versions.compileSdk.get().toInteger()
    compileSdkMinor 0

    defaultConfig {
        minSdk libs.versions.minSdk.get().toInteger()
        targetSdk libs.versions.targetSdk.get().toInteger()
        python {
            version = "3.10"
            // 本机专用解释器，仅在本机存在时使用；CI / 其它机器上留空，
            // 让 Chaquopy 自动探测 PATH 上的 python（配合 workflow 里的 setup-python 3.10）。
            def localBuildPython = "C:/fongmi-src/py310_full/extracted/tools/python.exe"
            if (new File(localBuildPython).exists()) {
                buildPython localBuildPython
            }
            pip {
                install("-r", "requirements.txt")
            }
        }
    }

    flavorDimensions = ["abi"]

    productFlavors {
        arm64_v8a {
            dimension "abi"
            ndk { abiFilters "arm64-v8a" }
        }
        armeabi_v7a {
            dimension "abi"
            ndk { abiFilters "armeabi-v7a" }
        }
    }

    sourceSets {
        main {
            python.srcDirs = ["src/main/python"]
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation project(':catvod')
    coreLibraryDesugaring libs.desugar
}